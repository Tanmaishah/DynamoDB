syntax = "proto3";

package dynamo;

// ============================================
// Membership Messages
// ============================================

message NodeInfo {
    string node_id = 1;
    int32 capacity = 2;
    string address = 3;
    int64 last_seen = 4;     // Timestamp when last seen
    bool is_alive = 5;       // Alive or dead
}

message JoinRequest {
    string node_id = 1;
    int32 capacity = 2;
    string address = 3;
}

message JoinResponse {
    bool success = 1;
    repeated NodeInfo cluster_members = 2; 
}

// ============================================
// Data Operation Messages
// ============================================

// Vector clock for versioning
message VectorClock {
    map<string, int32> clock = 1;  // node_id -> counter
}

message PutRequest {
    string key = 1;
    string value = 2;
    VectorClock context = 3;  // Client's context (empty for first write)
}

message PutResponse {
    bool success = 1;
    VectorClock updated_clock = 2;  // Return updated clock to client
}

message GetRequest {
    string key = 1;
}

// Single versioned value
message VersionedValue {
    string value = 1;
    VectorClock vector_clock = 2;
}

message GetResponse {
    bool found = 1;
    repeated VersionedValue values = 2;  // May return multiple versions if conflict
}

// Internal replication messages
message ReplicatePutRequest {
    string key = 1;
    string value = 2;
    VectorClock vector_clock = 3;  // Include vector clock in replication
}

message ReplicatePutResponse {
    bool success = 1;   
}

message ReplicateGetRequest {
    string key = 1;
}

message ReplicateGetResponse {
    bool found = 1;
    repeated VersionedValue values = 2;  // Return all versions
}

// ============================================
// Gossip Protocol Messages
// ============================================

message GossipPing {
    string sender_id = 1;
    map<string, NodeInfo> ring_view = 2;  // Sender's view of the ring
}

message GossipPong {
    map<string, NodeInfo> ring_view = 1;  // Receiver's view of the ring
}

// ============================================
// Service Definitions
// ============================================

service DynamoService {
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
}

service NodeService {   
    rpc Join(JoinRequest) returns (JoinResponse);
    rpc ReplicateGet(ReplicateGetRequest) returns (ReplicateGetResponse);
    rpc ReplicatePut(ReplicatePutRequest) returns (ReplicatePutResponse);
    
    // Gossip protocol - FIXED: renamed method to Gossip (was GossipPing)
    rpc Gossip(GossipPing) returns (GossipPong);
}
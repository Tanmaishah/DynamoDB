syntax = "proto3";

package dynamo;

// ============================================
// Membership Messages
// ============================================

message NodeInfo {
    string node_id = 1;
    int32 capacity = 2;      // Fixed: was string, should be int32
    string address = 3;
}

message JoinRequest {
    string node_id = 1;
    int32 capacity = 2;      // Fixed: was string, should be int32
    string address = 3;
}

message JoinResponse {
    bool success = 1;
    repeated NodeInfo cluster_members = 2; 
}

// ============================================
// Data Operation Messages
// ============================================


message PutRequest{
    string key=1;
    string value=2;
}

message PutResponse{
    bool success=1;
}
message GetRequest{
    string key=1;
}

message GetResponse{
    bool success=1;
    string key=2;
}

message ReplicatePutRequest{
    string key=1;
    string value=2;   
}

message ReplicatePutResponse{
    bool success=1;   
}

message ReplicateGetRequest {
    string key = 1;
}

message ReplicateGetResponse {
    bool found = 1;
    string value = 2;
}

// ============================================
// Service Definition
// ============================================

service DynamoService{
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
}
service NodeService {   
    rpc Join(JoinRequest) returns (JoinResponse);
    rpc ReplicateGet(ReplicateGetRequest) returns (ReplicateGetResponse);
    rpc ReplicatePut(ReplicatePutRequest) returns (ReplicatePutResponse);
}